# ghost-check web app: a static site in web/. All scoring runs in the browser
# (web/ghost-check.js), so there is nothing to build. These settings override
# the build command / publish directory set in the Netlify UI.
[build]
  command = "echo 'static site, nothing to build'"
  publish = "web"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
